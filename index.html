<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A polished, realistic canvas remake of Flappy Bird with hand-drawn procedural art."
    />
    <title>Realistic Flappy Bird</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">Procedural Canvas Edition</p>
        <h1 id="game-title">Realistic Flappy Bird</h1>
        <p class="intro">
          Guide a feathered songbird through mossy copper pipes at golden hour.
          Tap, click, press Space, or use the Up arrow to flap.
        </p>
      </section>

      <section class="game-card" aria-label="Flappy Bird game">
        <div class="hud" aria-live="polite">
          <span>Score <strong id="score">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </div>
        <canvas id="game" width="960" height="1440">
          Your browser does not support the canvas element.
        </canvas>
        <div class="help">
          <span>Space / Up / Tap to flap</span>
          <span>Esc pauses</span>
        </div>
      </section>
    </main>

    <script type="module" src="./src/game.js"></script>
  </body>
</html>
